<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note Taking App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <h1>Note Taking App</h1>
    <p>Organize your thoughts and stay productive</p>
  </header>

  <main>
    <section>
      <h2>Add a note</h2>
      <form id="note-form">
        <div>
          <label for="note-input">Note Content:</label>
          <input type="text" id="note-input" name="note-input" placeholder="Enter your note here..." required>
        </div>

        <div>
          <label for="note-category">Category:</label>
          <select id="note-category" name="note-category">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
          </select>
        </div>

        <button type="submit">Add Note</button>
      </form>
      <p id="error-message"></p>
    </section>

    <section>
      <h2>Your notes</h2>
      <input type="text" id="search-input" placeholder="Search notes...">
      <p id="note-count">Total notes: 0</p>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Note Taking App. All rights reserved.</p>
  </footer>

</body>
</html>
